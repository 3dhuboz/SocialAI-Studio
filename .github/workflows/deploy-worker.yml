name: Deploy SocialAI API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-socialai-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - name: Install Worker dependencies
        run: npm ci
        working-directory: workers/api

      - name: Test Worker
        run: npm test
        working-directory: workers/api

      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: workers/api

      - name: Verify production bundle
        run: npx --yes wrangler@4.110.0 deploy --config wrangler.toml --env="" --dry-run
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy production Worker
        run: npx --yes wrangler@4.110.0 deploy --config wrangler.toml --env=""
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
